[package]
name = "krak"
version = "0.1.0"
authors = ["Clint Valentine <valentine.clint@gmail.com>"]
edition = "2021"
license = "MIT"
readme = "README.md"
repository = "https://github.com/clintval/krak"
description = "An addicting set of Kraken-enhancing tools."
documentation = "https://github.com/clintval/krak/README.md"
categories = ["command-line-utilities", "science"]
keywords = ["bioinformatics", "kraken", "taxonomic", "taxonomy", "classification"]

[profile.release]
codegen-units = 1
lto = true

[lib]
name = "kraklib"
path = "src/lib/mod.rs"

[[bin]]
name = "krak"
path = "src/main.rs"

[dependencies]
ahash = "0.8"
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
csv = "1"
env_logger = "0.11"
flate2 = "1"
log = "0.4"
memchr = "2"
noodles = { version = "0.109", features = ["bam", "bgzf", "core", "cram", "fasta", "fastq", "sam"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[dev-dependencies]
assert_cmd = "2"
criterion = { version = "0.5", features = ["html_reports"] }
predicates = "3"
pretty_assertions = "1"
rstest = "0.26"
tempfile = "3"
which = "6"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }
