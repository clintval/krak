[workspace]
name = "krak"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[feature.kraken.dependencies]
kraken = { version = "==1.1.1", channel = "bioconda" }

[feature.kraken2.dependencies]
kraken2 = { version = "==2.17.1", channel = "bioconda" }

[feature.samtools.dependencies]
samtools = { version = "==1.23.1", channel = "bioconda" }

[environments]
default = { features = ["kraken", "kraken2", "samtools"] }
