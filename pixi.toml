[workspace]
name = "krak"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[feature.kraken.dependencies]
kraken = { version = "==1.1.1", channel = "bioconda" }

[feature.kraken2.dependencies]
kraken2 = { version = "==2.17.1", channel = "bioconda" }

[feature.samtools.dependencies]
samtools = { version = "==1.23.1", channel = "bioconda" }

[feature.benchmarks.dependencies]
bwa-mem2 = { version = ">=2.2.1", channel = "bioconda" }
dwgsim = { version = ">=1.1.14", channel = "bioconda" }
pandas = { version = ">=2.0", channel = "conda-forge" }
plotly = { version = ">=5.0", channel = "conda-forge" }
python = { version = "~=3.12.0", channel = "conda-forge" }
seqkit = { version = ">=2.13.0,<3", channel = "bioconda" }
seqtk = { version = ">=1.5,<2", channel = "bioconda" }

[environments]
default = { features = ["kraken", "kraken2", "samtools"] }
benchmarks = { features = ["kraken", "kraken2", "samtools", "benchmarks"] }
